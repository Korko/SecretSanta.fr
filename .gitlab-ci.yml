stages:
  - test

# PHP 8.4 like prod, from the ondrej PPA, and Composer. The PPA key is in the repository (fingerprint
# 14AA40EC0831756756D7F66C4F4EA0AAE5267A6C): no add-apt-repository, so no call to the Launchpad API,
# which made every job fail while it was down. Fits the ubuntu:noble based images (php, e2e).
.php84:
  before_script:
    - apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates > /dev/null
    - cp .gitlab/ondrej-php.gpg /usr/share/keyrings/ondrej-php.gpg
    - echo "deb [signed-by=/usr/share/keyrings/ondrej-php.gpg] https://ppa.launchpadcontent.net/ondrej/php/ubuntu noble main" > /etc/apt/sources.list.d/ondrej-php.list
    - apt-get update -qq && apt-get install -yqq --no-install-recommends git unzip php8.4-cli php8.4-zip php8.4-intl php8.4-bcmath php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-curl > /dev/null
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');" && php composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer && rm composer-setup.php
    - composer install --no-interaction --no-progress

# Lint (Pint, Rector), PHPStan, type coverage and Pest, like `composer test` locally
php:
  stage: test
  image: ubuntu:noble
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  # Shared by all branches, renewed when the lock file changes
  cache:
    key:
      prefix: composer
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - !reference [.php84, before_script]
    - cp .env.example .env && php artisan key:generate
  script:
    - composer audit --abandoned=ignore
    - composer test
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure

# public/build is committed (no node in prod): fail if it doesn't match the sources
assets:
  stage: test
  image: node:22
  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - cp .env.example .env
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm audit --omit=dev
    - npm run build
    - git status --porcelain public/build
    - test -z "$(git status --porcelain public/build)" || (echo "public/build is outdated, run npm run build and commit" && exit 1)

# Pest browser tests (form, CSV import, organizer panel, dearSanta) on the committed public/build
e2e:
  stage: test
  # Ships node and chromium with its system deps; keep the tag in sync with playwright in package-lock.json
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    - key:
        prefix: composer
        files:
          - composer.lock
      paths:
        - .composer-cache/
    - key:
        prefix: npm
        files:
          - package-lock.json
      paths:
        - .npm/
  before_script:
    - !reference [.php84, before_script]
    - cp .env.example .env && php artisan key:generate
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - vendor/bin/pest --testsuite=Browser
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure
