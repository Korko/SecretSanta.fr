stages:
  - test

# Lint (Pint, Rector), PHPStan, type coverage and Pest, like `composer test` locally
php:
  stage: test
  image: php:8.4-cli
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - .composer-cache/
  before_script:
    - apt-get update -qq && apt-get install -yqq --no-install-recommends git unzip libzip-dev libicu-dev > /dev/null
    - docker-php-ext-install -j"$(nproc)" zip intl bcmath sockets > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --quiet
    - php composer.phar install --no-interaction --no-progress
    - cp .env.example .env && php artisan key:generate
  script:
    - php composer.phar test
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure

# public/build is committed (no node in prod): fail if it doesn't match the sources
assets:
  stage: test
  image: node:22
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  script:
    - cp .env.example .env
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    - git status --porcelain public/build
    - test -z "$(git status --porcelain public/build)" || (echo "public/build is outdated, run npm run build and commit" && exit 1)

# Pest browser tests (form, CSV import, organizer panel, dearSanta) on the committed public/build
e2e:
  stage: test
  # Ships node and chromium with its system deps; keep the tag in sync with playwright in package-lock.json
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
    DEBIAN_FRONTEND: noninteractive
  cache:
    key: e2e-$CI_COMMIT_REF_SLUG
    paths:
      - .composer-cache/
      - .npm/
  before_script:
    # Prebuilt PHP 8.4 like prod, no extension compiling
    - apt-get update -qq && apt-get install -yqq --no-install-recommends software-properties-common gpg-agent > /dev/null
    - add-apt-repository -y ppa:ondrej/php > /dev/null
    - apt-get install -yqq --no-install-recommends git unzip php8.4-cli php8.4-zip php8.4-intl php8.4-bcmath php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-curl > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --quiet
    - php composer.phar install --no-interaction --no-progress
    - cp .env.example .env && php artisan key:generate
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - vendor/bin/pest --testsuite=Browser
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure
