stages:
  - test

# PHP 8.4 like prod, from Ondřej Surý's repository (packages.sury.org, which replaced his Launchpad PPA), and
# Composer. The repository key is in the repository: nothing to download before trusting it (DEB.SURY.ORG
# Automatic Signing Key, fingerprint 15058500A0235D97F5D10063B188E2B695BD4743, expires 2028-02-04: renew
# .gitlab/sury-php.gpg from https://packages.sury.org/php/apt.gpg by then). Fits the ubuntu:noble based images (php, e2e).
.php84:
  before_script:
    - apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates > /dev/null
    - cp .gitlab/sury-php.gpg /usr/share/keyrings/sury-php.gpg
    - echo "deb [signed-by=/usr/share/keyrings/sury-php.gpg] https://packages.sury.org/php/ noble main" > /etc/apt/sources.list.d/sury-php.list
    - apt-get update -qq && apt-get install -yqq --no-install-recommends git unzip php8.4-cli php8.4-zip php8.4-intl php8.4-bcmath php8.4-sqlite3 php8.4-mbstring php8.4-xml php8.4-curl > /dev/null
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');" && php composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer && rm composer-setup.php
    - composer install --no-interaction --no-progress

# Lint (Pint, Rector), PHPStan, type coverage and Pest, like `composer test` locally
php:
  stage: test
  image: ubuntu:noble
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  # Shared by all branches, renewed when the lock file changes
  cache:
    key:
      prefix: composer
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - !reference [.php84, before_script]
    - cp .env.example .env && php artisan key:generate
  script:
    - composer audit --abandoned=ignore
    - composer test
    # resources/js/langs is generated from lang/*.php: fail if it wasn't regenerated (it drifted before)
    - php artisan vue-i18n:generate --multi-locales
    - git diff --exit-code resources/js/langs || (echo "resources/js/langs is outdated, run php artisan vue-i18n:generate --multi-locales and commit" && exit 1)
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure

# public/build is committed (no node in prod): fail if it doesn't match the sources
assets:
  stage: test
  image: node:22
  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - cp .env.example .env
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm audit --omit=dev
    - npm run build
    - git status --porcelain public/build
    - test -z "$(git status --porcelain public/build)" || (echo "public/build is outdated, run npm run build and commit" && exit 1)

# Pest browser tests (form, CSV import, organizer panel, dearSanta) on the committed public/build
e2e:
  stage: test
  # Ships node and chromium with its system deps; keep the tag in sync with playwright in package-lock.json
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    - key:
        prefix: composer
        files:
          - composer.lock
      paths:
        - .composer-cache/
    - key:
        prefix: npm
        files:
          - package-lock.json
      paths:
        - .npm/
  before_script:
    - !reference [.php84, before_script]
    - cp .env.example .env && php artisan key:generate
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - vendor/bin/pest --testsuite=Browser
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure
