stages:
  - build
  - test

variables:
  # Bump the tag on any change of docker/ci/Dockerfile
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:playwright1.61.1-php8.4-1

# Builds the CI image when its Dockerfile changes (needs the project's container registry)
ci-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - changes:
        paths:
          - docker/ci/Dockerfile
        compare_to: refs/heads/1.9.x
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/docker/ci" --dockerfile "$CI_PROJECT_DIR/docker/ci/Dockerfile" --destination "$CI_IMAGE"

# Lint (Pint, Rector), PHPStan, type coverage and Pest, like `composer test` locally
php:
  stage: test
  image: $CI_IMAGE
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  # Shared by all branches, renewed when the lock file changes
  cache:
    key:
      prefix: composer
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - composer install --no-interaction --no-progress
    - cp .env.example .env && php artisan key:generate
  script:
    - composer audit --abandoned=ignore
    - composer test
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure

# public/build is committed (no node in prod): fail if it doesn't match the sources
assets:
  stage: test
  image: node:22
  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - cp .env.example .env
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm audit --omit=dev
    - npm run build
    - git status --porcelain public/build
    - test -z "$(git status --porcelain public/build)" || (echo "public/build is outdated, run npm run build and commit" && exit 1)

# Pest browser tests (form, CSV import, organizer panel, dearSanta) on the committed public/build
e2e:
  stage: test
  # Playwright, PHP 8.4 and Composer preinstalled (docker/ci/Dockerfile)
  image: $CI_IMAGE
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    - key:
        prefix: composer
        files:
          - composer.lock
      paths:
        - .composer-cache/
    - key:
        prefix: npm
        files:
          - package-lock.json
      paths:
        - .npm/
  before_script:
    - composer install --no-interaction --no-progress
    - cp .env.example .env && php artisan key:generate
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - vendor/bin/pest --testsuite=Browser
  artifacts:
    paths:
      - storage/logs
      - tests/Browser/Screenshots
    expire_in: 7 days
    when: on_failure
