stages:
  - test

# Lint (Pint, Rector), PHPStan, type coverage and Pest, like `composer test` locally
php:
  stage: test
  image: php:8.4-cli
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - .composer-cache/
  before_script:
    - apt-get update -qq && apt-get install -yqq --no-install-recommends git unzip libzip-dev libicu-dev > /dev/null
    - docker-php-ext-install -j"$(nproc)" zip intl bcmath sockets > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --quiet
    - php composer.phar install --no-interaction --no-progress
    - cp .env.example .env && php artisan key:generate
  script:
    - php composer.phar test
  artifacts:
    paths:
      - storage/logs
    expire_in: 7 days
    when: on_failure

# public/build is committed (no node in prod): fail if it doesn't match the sources
assets:
  stage: test
  image: node:22
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  script:
    - cp .env.example .env
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    - git status --porcelain public/build
    - test -z "$(git status --porcelain public/build)" || (echo "public/build is outdated, run npm run build and commit" && exit 1)

# Real browser flow (form, CSV import, organizer panel, dearSanta) on the committed public/build
e2e:
  stage: test
  image: php:8.4-cli
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright"
    DEBIAN_FRONTEND: noninteractive
  cache:
    key: e2e-$CI_COMMIT_REF_SLUG
    paths:
      - .composer-cache/
      - .npm/
      - .playwright/
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null # Debian ships node 20, vue-i18n needs 22 like the assets job
    - apt-get update -qq && apt-get install -yqq --no-install-recommends git unzip libzip-dev libicu-dev libsqlite3-dev nodejs > /dev/null
    - docker-php-ext-install -j"$(nproc)" zip intl bcmath sockets pdo_sqlite > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --quiet
    - php composer.phar install --no-interaction --no-progress
    - cp .env.example .env && php artisan key:generate
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx playwright install --with-deps chromium > /dev/null
  script:
    - npm run e2e
  artifacts:
    paths:
      - storage/logs
    expire_in: 7 days
    when: on_failure
